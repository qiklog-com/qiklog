name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore QikLog.sln

      - name: Build
        run: dotnet build QikLog.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test QikLog.sln --configuration Release --no-build --verbosity normal --filter "Category!=E2E"

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/QikLog.Api/Dockerfile
          push: false
          tags: qiklog-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/QikLog.Web/Dockerfile
          push: false
          tags: qiklog-web:ci

  www-build:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: Install and build marketing site
        working-directory: www
        run: |
          npm ci
          npm run build
